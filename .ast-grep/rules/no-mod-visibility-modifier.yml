id: no-mod-visibility-modifier
language: Rust
severity: error
# Modules are private implementation boundaries. Keep `mod` declarations
# private and explicitly re-export items with `pub use` / `pub(crate) use` /
# `pub(super) use` instead of exposing the module namespace itself.
rule:
  kind: visibility_modifier
  pattern: $MOD
  inside:
    kind: mod_item
    stopBy: neighbor
message: >
  Do not add a visibility modifier (`$MOD`) to `mod`; keep modules private and
  re-export items with `pub use` or `pub(crate) use` instead.
