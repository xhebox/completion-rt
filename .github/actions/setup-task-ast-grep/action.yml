name: Set up task and ast-grep
description: Install task and ast-grep. Node is preinstalled on every GitHub runner, so ast-grep comes from npm.
runs:
  using: composite
  steps:
    - name: Install task
      uses: arduino/setup-task@v3
      with:
        repo-token: ${{ github.token }}

    - name: Install ast-grep
      shell: bash
      run: npm install -g @ast-grep/cli
