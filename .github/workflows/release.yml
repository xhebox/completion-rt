name: Release

on:
  push:
    tags: [v*]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up task and ast-grep
        uses: ./.github/actions/setup-task-ast-grep

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # Leave RUSTFLAGS unset; it would override the rustflags in .cargo/config.toml.
          rustflags: ""

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # cargo publish cannot be undone, so a tag that lands on a broken merge fails here instead.
      - name: Test
        run: task test

  crates-io:
    needs: test
    runs-on: ubuntu-26.04
    # Trusted publishing on crates.io names this environment, which only v* tags may deploy to.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # Leave RUSTFLAGS unset; it would override the rustflags in .cargo/config.toml.
          rustflags: ""
          cache: false

      # No store secret: the registry token is minted from this job's OIDC identity.
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
