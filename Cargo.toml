[workspace]
members = ["crates/completion-backend", "crates/completion-async"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "MIT"
repository = "https://github.com/xhebox/completion-rt"

[workspace.dependencies]
completion-backend = { version = "0.1.0", path = "crates/completion-backend" }
async-task = "4.7"
crossbeam-deque = "0.8"
env_logger = "0.11"
log = { version = "0.4.34", features = ["std", "kv"] }
rustix = "1.1"
scopeguard = "1"
slotmap = "1"
smallvec = "1"
socket2 = "0.6"
tempfile = "3"
windows-sys = "0.60"

[workspace.lints.rust]
let_underscore_drop = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
disallowed_methods = "deny"
len_without_is_empty = "allow"
len_zero = "allow"
print_stderr = "deny"
print_stdout = "deny"
pub_underscore_fields = "deny"
tabs_in_doc_comments = "allow"
wildcard_imports = "deny"

