[workspace]
members = ["crates/completion-backend", "crates/completion-async"]
resolver = "3"

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.96.1"
license = "MIT"
repository = "https://github.com/xhebox/completion-rt"

[workspace.dependencies]
completion-backend = { version = "0.2.2", path = "crates/completion-backend" }
assert2 = "0.4"
compio = { version = "0.20.0-beta.1", features = ["fs", "io", "net", "runtime", "time"] }
crossbeam-queue = "0.3"
divan = "0.1"
env_logger = "0.11"
futures-io = "0.3"
insta = "1.49"
log = { version = "0.4.34", features = ["std", "kv"] }
rstest = { version = "0.28", default-features = false }
rustix = "1.1"
scopeguard = "1"
slotmap = "1"
smallvec = "1"
smol = "2"
socket2 = "0.6"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "net", "rt", "rt-multi-thread", "time"] }
windows-sys = "0.60"

[workspace.lints.rust]
let_underscore_drop = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
disallowed_methods = "deny"
len_without_is_empty = "allow"
len_zero = "allow"
print_stderr = "deny"
print_stdout = "deny"
pub_underscore_fields = "deny"
tabs_in_doc_comments = "allow"
wildcard_imports = "deny"

