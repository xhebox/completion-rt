version: '3'

vars:
  # The cargo profile every recipe builds under. Unset means cargo's own
  # default (dev): `--profile` is not passed at all, so plain `cargo` and
  # rust-analyzer use the same profile, and the same artifacts.
  PROFILE: '{{.PROFILE | default "dev"}}'
  PROFILE_ARG: '{{if ne .PROFILE "dev"}}--profile {{.PROFILE}}{{end}}'
  # `--profile` on nextest names a nextest profile; the cargo profile a recipe
  # wants goes through `--cargo-profile`.
  CARGO_PROFILE_ARG: '{{if ne .PROFILE "dev"}}--cargo-profile {{.PROFILE}}{{end}}'
  # Every target `check` cross-checks; keep in step with rust-toolchain.toml and
  # the CI matrix.
  TARGETS: aarch64-unknown-linux-musl x86_64-unknown-linux-musl aarch64-apple-darwin x86_64-pc-windows-msvc

tasks:
  default:
    deps: [build]

  build:
    desc: "Build the library for the host"
    cmds:
      - cargo build {{.PROFILE_ARG}} --locked {{.CLI_ARGS}}

  # CI calls this, so it must fail on a formatting diff rather than rewrite the tree.
  check:
    desc: "Check formatting and cross-check every target, without rewriting files"
    cmds:
      - cargo fmt --all --check
      - ast-grep scan --report-style short
      - for: { var: TARGETS }
        task: check-target
        vars: { TARGET: '{{.ITEM}}' }

  fmt:
    desc: "Rewrite every source file in place with rustfmt"
    cmds:
      - cargo fmt --all

  check-target:
    internal: true
    cmds:
      # `--all-targets` covers the tests too, which are where the platform
      # cfgs and the scratch helpers live.
      - cargo check {{.PROFILE_ARG}} --all-targets --locked --target {{.TARGET}}

  test:
    desc: "Run every test on the host"
    cmds:
      - cargo nextest run {{.CARGO_PROFILE_ARG}} --locked {{.CLI_ARGS}}

  # `--no-deps` keeps it to this workspace's crates; a lint in a dependency is
  # not ours to fix.
  doc:
    desc: "Build the API documentation"
    cmds:
      - cargo doc --no-deps {{.PROFILE_ARG}} --locked {{.CLI_ARGS}}

  # Every other recipe passes `--locked`; this is the one that rewrites the
  # lock file, after a manifest change (a dependency added or removed).
  lock:
    desc: "Sync Cargo.lock with the manifest"
    cmds:
      - cargo metadata --format-version 1 > /dev/null
