version: '3'

vars:
  # Every target `check` cross-checks; keep in step with rust-toolchain.toml and
  # the CI matrix.
  TARGETS: x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-pc-windows-msvc

tasks:
  # CI calls this, so it must fail on a formatting diff rather than rewrite the tree.
  check:
    desc: "Format and lint every target"
    cmds:
      - cargo fmt --all --check
      - for: { var: TARGETS }
        task: check-target
        vars: { TARGET: '{{.ITEM}}' }

  check-target:
    internal: true
    cmds:
      # `--all-targets` covers the tests too, which are where the platform
      # cfgs and the scratch helpers live.
      - cargo clippy --all-targets --locked --target {{.TARGET}} {{.CLI_ARGS}}

  test:
    desc: "Run every test on the host"
    cmds:
      - cargo nextest run --locked {{.CLI_ARGS}}

  doc:
    desc: "Build the API documentation"
    cmds:
      - cargo doc --no-deps --locked {{.CLI_ARGS}}

  bench:
    desc: "Run every benchmark on the host"
    cmds:
      - cargo bench --benches --locked -- {{.CLI_ARGS}}
