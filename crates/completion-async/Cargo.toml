[package]
name = "completion-async"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "The async runtime over completion-backend: executor and resource handles."
license = "MIT"
repository = "https://github.com/xhebox/completion-rt"

[dependencies]
completion-backend = { path = "../completion-backend" }
fastrace = "0.7.19"
log ={ version = "0.4.34", features = ["std", "kv"] }
slotmap = "1"
smallvec = "1"
socket2 = "0.6"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["event", "fs", "net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Storage_FileSystem"] }

[dev-dependencies]
env_logger = "0.11"
tempfile = "3"

[lints]
workspace = true

