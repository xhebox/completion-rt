[package]
name = "completion-async"
description = "The async runtime over completion-backend: executor and resource handles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
completion-backend.workspace = true
async-task.workspace = true
crossbeam-deque.workspace = true
fastrace = "0.7.19"
log.workspace = true
scopeguard.workspace = true
slotmap.workspace = true
smallvec.workspace = true
socket2.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["event", "fs", "net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
env_logger.workspace = true
tempfile.workspace = true

[lints]
workspace = true

