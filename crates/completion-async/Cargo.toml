[package]
name = "completion-async"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The async runtime over completion-backend: executor and resource handles."
license.workspace = true
repository.workspace = true

[dependencies]
async-task.workspace = true
completion-backend = { path = "../completion-backend" }
crossbeam-deque.workspace = true
fastrace = "0.7.19"
log.workspace = true
scopeguard.workspace = true
slotmap.workspace = true
smallvec.workspace = true
socket2.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["event", "fs", "net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Storage_FileSystem"] }

[dev-dependencies]
env_logger.workspace = true
tempfile.workspace = true

[lints]
workspace = true

