[package]
name = "completion-backend"
description = "Completion-model I/O backend: io_uring, IOCP, and polling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blocking = "1.7"
enum_dispatch = "0.3"
log.workspace = true
polling = "3.11"
slotmap.workspace = true
smallvec.workspace = true
socket2.workspace = true
strum = { version = "0.28", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading"] }

# The portable backend: readiness from `polling` (epoll, kqueue, event ports,
# IOCP) and file I/O on `blocking`'s thread pool, on every target. Its socket
# calls are `socket2`'s on every target; the rest are unix's here and Win32's on
# the windows target.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { workspace = true, features = ["event", "fs", "net", "thread"] }

[features]
# `iowait` withholds `IORING_ENTER_NO_IOWAIT` from the ring's blocking waits,
# so their sleep counts as iowait the way the kernel's own default would.
iowait = []

[dev-dependencies]
env_logger.workspace = true
tempfile.workspace = true

[lints]
workspace = true

