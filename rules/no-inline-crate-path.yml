id: no-inline-crate-path
language: rust
severity: error
message: Cross-module references go through `use`, so a module's imports list every module it depends on. Import the item instead of naming it by its `crate::` path.
# Only sources under a `src/` directory: tests and benches may name `crate::` freely.
files:
  - '**/src/**'
rule:
  kind: crate
  not:
    any:
      - inside:
          kind: use_declaration
          stopBy: end
      - inside:
          kind: visibility_modifier
          stopBy: end
      # `pub(crate)` inside a macro body (e.g. `thread_local!`) is not parsed
      # as a visibility_modifier: it is a `(crate)` token tree after `pub`.
      - inside:
          kind: token_tree
          stopBy: neighbor
          follows:
            regex: '^pub$'
