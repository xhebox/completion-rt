id: no-libc
language: rust
severity: error
message: Don't use libc outside the whitelisted platform/FFI layers. Use rustix (or std) instead.
ignores:
  - crates/completion-backend/src/backend/uring.rs
  - crates/completion-backend/src/backend/portable/unix.rs
rule:
  kind: identifier
  regex: '^libc$'
