[toolchain]
channel = "1.96.1"
components = ["rustfmt", "rust-analyzer"]
# `task check` cross-checks every backend: uring and the portable one on the
# unix targets, iocp on the msvc windows target.
targets = [
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
